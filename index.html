function buildQuery(catId, members, destination){
  const dest = destination || "nearby";
  if(!members || !members.length){
    const defaults = {
      restaurants:`restaurants ${dest}`, hikes:`hiking trails ${dest}`,
      water:`water activities swimming ${dest}`, cafes:`coffee shops cafes ${dest}`,
      attractions:`tourist attractions things to do ${dest}`, scenic:`scenic viewpoints overlooks ${dest}`,
      shopping:`shopping markets ${dest}`, family:`family activities kids ${dest}`,
    };
    return defaults[catId]||`${catId} ${dest}`;
  }
  const kids=members.filter(m=>m.type==="kid");
  const allProfiles=[...new Set(members.flatMap(m=>m.foodProfiles||[]))];
  const ages=kids.map(k=>parseInt(k.age)).filter(a=>!isNaN(a));
  const minAge=ages.length?Math.min(...ages):null;
  const hasToddler=minAge!==null&&minAge<=3;
  const hasYoungKid=minAge!==null&&minAge<=10;
  const isVeg=allProfiles.some(p=>["veggie","vegan"].includes(p));
  const isPesc=allProfiles.includes("pescatarian");
  const isProtein=allProfiles.some(p=>["protein","meat"].includes(p));
  const isGF=allProfiles.includes("glutenfree");
  switch(catId){
    case "restaurants":
      if(isVeg) return `vegetarian vegan restaurants ${dest}`;
      if(isPesc) return `seafood fish restaurants ${dest}`;
      if(isProtein) return `BBQ steakhouse meat restaurants ${dest}`;
      if(isGF) return `gluten free restaurants ${dest}`;
      if(hasYoungKid) return `family restaurants kids menu ${dest}`;
      return `restaurants ${dest}`;
    case "hikes":
      if(hasToddler) return `easy flat walk nature trail stroller accessible ${dest}`;
      if(hasYoungKid) return `easy family hiking trail kids ${dest}`;
      return `hiking trails ${dest}`;
    case "water":
      if(hasToddler) return `splash pad kiddie pool toddler water play ${dest}`;
      if(hasYoungKid) return `family water park swimming kids ${dest}`;
      return `water activities swimming ${dest}`;
    case "attractions":
      if(hasToddler) return `toddler friendly attractions museums indoor ${dest}`;
      if(hasYoungKid) return `family friendly attractions kids ${dest}`;
      return `tourist attractions ${dest}`;
    case "cafes":
      if(isGF) return `gluten free bakery cafe ${dest}`;
      return `coffee shops cafes ${dest}`;
    case "scenic":
      if(hasYoungKid) return `easy accessible scenic viewpoints ${dest}`;
      return `scenic overlooks viewpoints ${dest}`;
    case "shopping": return `shopping markets ${dest}`;
    case "family":
      if(hasToddler) return `toddler activities play area ${dest}`;
      if(hasYoungKid) return `family fun activities kids ${dest}`;
      return `fun activities group ${dest}`;
    default: return `${catId} ${dest}`;
  }
}

function memberContextLabel(members){
  if(!members.length) return null;
  const kids=members.filter(m=>m.type==="kid");
  const adults=members.filter(m=>m.type==="adult");
  const parts=[];
  if(adults.length) parts.push(`${adults.length} adult${adults.length>1?"s":""}`);
  if(kids.length){
    const ages=kids.map(k=>k.age).filter(Boolean);
    parts.push(`${kids.length} kid${kids.length>1?"s":""}${ages.length?` (${ages.join(", ")}yo)`:""}`);
  }
  const profiles=[...new Set(members.flatMap(m=>m.foodProfiles||[]))];
  const FOOD_LABELS={vacation:"🎉 No restrictions",protein:"💪 Protein",meat:"🥩 Meat lover",veggie:"🥗 Vegetarian",vegan:"🌱 Vegan",pescatarian:"🐟 Pescatarian",keto:"🧀 Keto",glutenfree:"🌾 Gluten-free"};
  profiles.forEach(p=>{if(FOOD_LABELS[p]) parts.push(FOOD_LABELS[p]);});
  return parts.join(" · ");
}

// ─── CATEGORIZE FROM PLACES TYPES + KEYWORD FALLBACK ─────────────────────────
function categorizePlace(types, title){
  const t=(types||[]).map(x=>x.toLowerCase());
  const n=(title||"").toLowerCase();
  // Pre-check: title keywords that override type classification
  if(/water.?park|aquatic|splash|swim.?center|pool/.test(n)) return "water";
  if(t.some(x=>["restaurant","food","meal_delivery","meal_takeaway","bar","night_club"].includes(x))) return "restaurants";
  if(t.some(x=>["cafe","coffee_shop","bakery"].includes(x))) return "cafes";
  if(t.some(x=>["shopping_mall","store","clothing_store","book_store","department_store","supermarket"].includes(x))) return "shopping";
  if(t.some(x=>["swimming_pool","beach","lake","river","water_park"].includes(x))) return "water";
  if(t.some(x=>["tourist_attraction","museum","art_gallery","zoo","aquarium","amusement_park"].includes(x))) return "attractions";
  if(t.some(x=>["campground","rv_park","hiking_area"].includes(x))) return "hikes";
  if(t.some(x=>["stadium","performing_arts_theater","movie_theater"].includes(x))) return "events";
  if(t.some(x=>["natural_feature","park","national_park"].includes(x))) return "lookouts";
  if(/restaurant|grill|bbq|diner|bistro|kitchen|eatery|steakhouse|sushi|pizza|taco|burger|pub/.test(n)) return "restaurants";
  if(/coffee|caf|bakery|espresso|roaster|tea/.test(n)) return "cafes";
  if(/trail|hike|hiking|trek|mountain|peak|summit|appalachian/.test(n)) return "hikes";
  if(/overlook|lookout|vista|scenic|viewpoint|observation|panorama/.test(n)) return "lookouts";
  if(/shop|store|market|outlet|mall|boutique|antique|gift/.test(n)) return "shopping";
  if(/festival|concert|event|fair|show|performance/.test(n)) return "events";
  if(/beach|lake|river|creek|swim|waterfall|kayak|fishing|water/.test(n)) return "water";
  if(/cave|cavern|museum|historic|monument|zoo|aquarium|garden|castle|fort|gallery/.test(n)) return "attractions";
  return "attractions";
}

function tripDayOptions(trip){
  if(!trip)return[];
  const days=[];
  const d=new Date(trip.startDate+"T12:00:00");
  const end=new Date(trip.endDate+"T12:00:00");
  while(d<=end){
    const iso=d.toISOString().split("T")[0];
    const label=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    days.push({value:iso,label:`${label} — Day ${days.length+1}`});
    d.setDate(d.getDate()+1);
  }
  return days;
}

// ─── PLACES SEARCH ────────────────────────────────────────────────────────────
function PlacesSearch({onSelect,mapsReady}){
  const [q,setQ]=useState("");
  const [preds,setPreds]=useState([]);
  const [loading,setLoad]=useState(false);
  const [open,setOpen]=useState(false);
  const timer=useRef(null);
  useEffect(()=>{
    if(!mapsReady||q.length<2){setPreds([]);setOpen(false);return;}
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>{
      const svc=new window.google.maps.places.AutocompleteService();
      svc.getPlacePredictions({input:q},(results,status)=>{
        if(status===window.google.maps.places.PlacesServiceStatus.OK){setPreds(results||[]);setOpen(true);}
        else{setPreds([]);setOpen(false);}
      });
    },320);
    return()=>clearTimeout(timer.current);
  },[q,mapsReady]);
  function pick(pred){
    setLoad(true);setOpen(false);setQ("");
    const div=document.createElement("div");
    const svc=new window.google.maps.places.PlacesService(div);
    svc.getDetails({placeId:pred.place_id,fields:["name","formatted_address","geometry","url","types"]},(place,status)=>{
      setLoad(false);
      if(status===window.google.maps.places.PlacesServiceStatus.OK){
        onSelect({title:place.name,address:place.formatted_address,mapsUrl:place.url,placeId:pred.place_id,types:place.types||[],lat:place.geometry?.location?.lat(),lng:place.geometry?.location?.lng()});
      }
    });
  }
  if(!mapsReady)return <div style={{padding:"12px 14px",background:C.cream,borderRadius:10,fontSize:13,color:C.muted,textAlign:"center"}}>🔑 Places API loading…</div>;
  return <div style={{position:"relative"}}>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search Google Maps…" style={{width:"100%",padding:"12px 14px",borderRadius:11,border:`1.5px solid ${C.border}`,background:C.bg,fontSize:15,color:C.text,fontFamily:"'DM Sans',sans-serif"}}/>
    {loading&&<div style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.muted}}>⏳</div>}
    {open&&preds.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:200,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,boxShadow:"0 8px 24px rgba(28,22,18,0.12)",overflow:"hidden",marginTop:4}}>
      {preds.slice(0,5).map(p=><div key={p.place_id} onClick={()=>pick(p)} style={{padding:"12px 14px",cursor:"pointer",borderBottom:`1px solid ${C.border}`}} onMouseOver={e=>e.currentTarget.style.background=C.cream} onMouseOut={e=>e.currentTarget.style.background="transparent"}>
        <div style={{fontSize:14,fontWeight:500,color:C.text}}>{p.structured_formatting?.main_text||p.description}</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>{p.structured_formatting?.secondary_text||""}</div>
      </div>)}
    </div>}
  </div>;
}
